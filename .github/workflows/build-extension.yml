name: Build Extension

on:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm --filter @fiber-wallet/app run build:extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiber-wallet-extension
          path: apps/dist-extension/
          retention-days: 30
